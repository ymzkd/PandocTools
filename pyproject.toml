[project]
name = "pandoc-gui"
version = "0.1.0"
description = "Windows GUI application for Pandoc conversion"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.6.0",
    "pypandoc>=1.12",
    "pyyaml>=6.0",
]

[project.scripts]
# CLI (Qt 非依存)。uv tool install / pip install で `pandoctools` として PATH に出る
pandoctools = "cli:main"
# GUI エントリ
pandoc-gui = "main:main"

[build-system]
# hatchling 1.24.1: ビルドフックの shared_scripts (1.24.0) とその実行権限の保持
# zstandard: rsvg-convert の配布物 (.zst) の展開用。wheel の無い armv7l / riscv64 では
#   入れない (ビルド環境の準備ごと失敗させないため。取得は警告だけで続行する)
requires = [
    "hatchling>=1.24.1",
    "zstandard; platform_machine != 'armv7l' and platform_machine != 'riscv64'",
]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
# wheel ビルド時に OS に合う rsvg-convert を取得し、環境の Scripts (bin) に入るよう同梱する (hatch_build.py)

[tool.hatch.build.targets.wheel]
# src/ 直下のフラットなモジュール (cli, common, engines, config ...) を
# top-level モジュールとして配置する (src/ プレフィックスを除去)。
# これにより `from common import ...` 等の既存 import と `python src/main.py` 実行を維持したまま
# editable install でき、エントリポイント cli:main / main:main が解決する。
only-include = ["src"]
sources = ["src"]

[tool.uv]
dev-dependencies = [
    "pyinstaller>=6.0.0",
    "pytest>=7",
    # scripts/fetch_rsvg_convert.py を直接実行するとき用 (build.bat など)
    "zstandard; platform_machine != 'armv7l' and platform_machine != 'riscv64'",
]
# 本体を作り直す (ビルドフックで rsvg-convert を取り直す) きっかけ。既定の
# pyproject.toml に加え、取得する版の更新と、取得し損ねた後の手動取得 (版の記録) を拾う
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "scripts/fetch_rsvg_convert.py" },
    { file = "src/bin/rsvg-convert.version" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
